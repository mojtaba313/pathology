<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><rect width="900" height="430" rx="24" fill="#101a30"/><text x="450" y="43" text-anchor="middle" fill="#f7f8ff" font-size="26" font-family="Arial" font-weight="700">SNP / SNV versus CNV</text><rect x="38" y="72" width="400" height="322" rx="18" fill="#172b42" stroke="#397e91"/><rect x="462" y="72" width="400" height="322" rx="18" fill="#211c3b" stroke="#8560b0"/><text x="238" y="111" text-anchor="middle" font-family="Arial" font-size="25" fill="#70e0df" font-weight="700">SNP / SNV</text><text x="662" y="111" text-anchor="middle" font-family="Arial" font-size="25" fill="#d2a7ff" font-weight="700">CNV</text><text x="70" y="150" font-family="Arial" font-size="18" fill="#e9efff">Sequence position</text><text x="494" y="150" font-family="Arial" font-size="18" fill="#e9efff">Copy number of a region</text><g font-family="Arial" font-size="21" text-anchor="middle"><text x="92" y="213" fill="#fff">A</text><text x="142" y="213" fill="#fff">C</text><text x="192" y="213" fill="#fff">G</text><text x="242" y="213" fill="#fff">T</text><text x="292" y="213" fill="#fff">A</text><text x="342" y="213" fill="#fff">G</text><text x="392" y="213" fill="#fff">C</text></g><rect x="177" y="178" width="30" height="50" rx="5" fill="#9e364d"/><text x="192" y="212" text-anchor="middle" font-size="21" fill="#fff" font-family="Arial">G</text><path d="M192 235V254" stroke="#70e0df" stroke-width="3"/><text x="192" y="278" text-anchor="middle" font-size="17" fill="#70e0df" font-family="Arial">single-base change</text><g><path d="M510 198H810" stroke="#98a8c7" stroke-width="3"/><rect x="556" y="178" width="90" height="38" rx="7" fill="#8e64b9"/><rect x="665" y="178" width="90" height="38" rx="7" fill="#8e64b9"/><text x="603" y="203" text-anchor="middle" font-family="Arial" font-size="17" fill="#fff">GENE</text><text x="710" y="203" text-anchor="middle" font-family="Arial" font-size="17" fill="#fff">GENE</text><path d="M510 254H810" stroke="#98a8c7" stroke-width="3"/><rect x="556" y="234" width="90" height="38" rx="7" fill="#8e64b9"/><rect x="665" y="234" width="90" height="38" rx="7" fill="#8e64b9"/><rect x="764" y="234" width="36" height="38" rx="7" fill="#e2a35b"/><text x="603" y="259" text-anchor="middle" font-family="Arial" font-size="17" fill="#fff">GENE</text><text x="710" y="259" text-anchor="middle" font-family="Arial" font-size="17" fill="#fff">GENE</text><text x="662" y="307" text-anchor="middle" font-size="17" fill="#dfc5ff" font-family="Arial">deletion or duplication → dosage changes</text></g><text x="238" y="342" text-anchor="middle" fill="#b6c5df" font-size="15" font-family="Arial">May be benign, risk-associated or pathogenic</text><text x="662" y="342" text-anchor="middle" fill="#b6c5df" font-size="15" font-family="Arial">Usually larger segment: kb to Mb</text></svg>