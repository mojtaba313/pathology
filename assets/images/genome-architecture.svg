<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380"><rect width="900" height="380" rx="26" fill="#101a30"/><text x="450" y="46" text-anchor="middle" fill="#f5f7ff" font-size="25" font-family="Arial" font-weight="700">Human genome: sequence → expression → phenotype</text><rect x="65" y="85" width="770" height="54" rx="12" fill="#273959"/><rect x="65" y="85" width="15" height="54" rx="7" fill="#8e9fbe"/><text x="95" y="118" fill="#fff" font-size="21" font-family="Arial">Genome (DNA sequence)</text><path d="M450 140V166" stroke="#9aa9c7" stroke-width="3"/><path d="M442 159l8 9 8-9" fill="none" stroke="#9aa9c7" stroke-width="3"/><rect x="65" y="173" width="370" height="65" rx="13" fill="#174e62"/><text x="250" y="201" fill="#fff" text-anchor="middle" font-size="20" font-family="Arial">Protein-coding genes</text><text x="250" y="223" fill="#b7f3ff" text-anchor="middle" font-size="15" font-family="Arial">exons + introns + regulation</text><rect x="465" y="173" width="370" height="65" rx="13" fill="#493866"/><text x="650" y="201" fill="#fff" text-anchor="middle" font-size="20" font-family="Arial">Noncoding / regulatory DNA</text><text x="650" y="223" fill="#e4d5ff" text-anchor="middle" font-size="15" font-family="Arial">miRNA, lncRNA, enhancers, repeats…</text><path d="M250 239V263H450V282" stroke="#75e3d3" stroke-width="3" fill="none"/><path d="M650 239V263H450" stroke="#c3a0ff" stroke-width="3" fill="none"/><rect x="280" y="286" width="340" height="48" rx="13" fill="#253a4b" stroke="#6fe2d2" stroke-width="1.5"/><text x="450" y="316" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial">Gene expression + environment</text></svg>