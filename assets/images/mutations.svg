<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485"><rect width="900" height="485" rx="24" fill="#101a30"/><text x="450" y="42" text-anchor="middle" fill="#f7f8ff" font-size="25" font-family="Arial" font-weight="700">Consequences of coding-sequence variants</text><g font-family="Arial"><rect x="35" y="70" width="400" height="165" rx="16" fill="#172b42" stroke="#397e91"/><text x="60" y="105" fill="#70e0df" font-size="21" font-weight="700">Reference coding sequence</text><text x="60" y="145" fill="#fff" font-size="22">ATG | GAA | CCT | TGG | TAA</text><text x="60" y="181" fill="#b7c9e6" font-size="16">Met | Glu | Pro | Trp | Stop</text><text x="60" y="210" fill="#b7c9e6" font-size="14">codons are read in groups of three</text><rect x="465" y="70" width="400" height="165" rx="16" fill="#211c3b" stroke="#8560b0"/><text x="490" y="105" fill="#d2a7ff" font-size="21" font-weight="700">Single-nucleotide substitution</text><text x="490" y="145" fill="#fff" font-size="22">ATG | GTG | CCT | TGG | TAA</text><text x="490" y="181" fill="#ffe1b6" font-size="16">Met | Val | Pro | Trp | Stop</text><text x="490" y="210" fill="#b7c9e6" font-size="14">missense: one amino acid changes</text><rect x="35" y="260" width="400" height="180" rx="16" fill="#2a2335" stroke="#bb7a54"/><text x="60" y="295" fill="#ffbd91" font-size="21" font-weight="700">Nonsense variant</text><text x="60" y="335" fill="#fff" font-size="22">ATG | TGA | …</text><text x="60" y="371" fill="#ffdfc8" font-size="16">premature stop codon</text><text x="60" y="400" fill="#b7c9e6" font-size="14">may cause truncated protein / NMD</text><rect x="465" y="260" width="400" height="180" rx="16" fill="#1a2e2e" stroke="#5fa69c"/><text x="490" y="295" fill="#8af1d8" font-size="21" font-weight="700">Frameshift insertion/deletion</text><text x="490" y="335" fill="#fff" font-size="21">ATG | AGC | CTT | GGT | …</text><text x="490" y="371" fill="#c8fff0" font-size="16">downstream codons change</text><text x="490" y="400" fill="#b7c9e6" font-size="14">usually severe if not divisible by 3</text></g></svg>